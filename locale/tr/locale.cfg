[mod-name]
universal-tweaker=Evrensel Varlık ve Silah Özelleştirici (Universal Tweaker)

[mod-description]
universal-tweaker=Factorio 2.1'deki binaların ve silahların tüm istatistiklerini, hızlarını ve verimliliklerini genel veya bireysel olarak serbestçe özelleştirin.

[mod-setting-name]
ut-global-crafting-speed=Genel üretim hızı çarpanı
ut-global-mining-speed=Genel madencilik hızı çarpanı
ut-global-mining-radius=Genel ilave madencilik yarıçapı
ut-global-lab-speed=Genel laboratuvar araştırma hızı çarpanı
ut-global-energy-multiplier=Genel enerji tüketimi çarpanı
ut-global-pollution-multiplier=Genel kirlilik çarpanı
ut-global-extra-module-slots=Genel ilave modül yuvası
ut-global-base-productivity=Genel dahili verimlilik bonusu
ut-global-building-health=Genel bina canı çarpanı

ut-global-gun-damage=Genel el silahı hasar çarpanı
ut-global-gun-range=Genel el silahı menzil çarpanı
ut-global-gun-firerate=Genel el silahı atış hızı çarpanı
ut-global-turret-damage=Genel taret hasar çarpanı
ut-global-turret-range=Genel taret menzil çarpanı
ut-global-turret-firerate=Genel taret atış hızı çarpanı
ut-global-ammo-damage=Genel mühimmat hasar çarpanı

ut-custom-building-overrides=Özel bina geçersiz kılmaları (DSL)
ut-custom-weapon-overrides=Özel silah ve taret geçersiz kılmaları (DSL)
ut-override-assembler3-speed=Montaj makinesi 3 hız geçersiz kılması
ut-override-assembler3-modules=Montaj makinesi 3 modül yuvası
ut-override-electric-drill-speed=Elektrikli maden sondajı hızı
ut-override-laser-turret-range=Lazer taret menzil geçersiz kılması
ut-override-laser-turret-damage=Lazer taret hasar çarpanı geçersiz kılması

[mod-setting-description]
ut-global-crafting-speed=Tüm montaj makinelerinin, fırınların ve siloların üretim hızını çarpar (1.0 = varsayılan).
ut-global-mining-speed=Tüm maden sondajlarının kazma hızını çarpar (1.0 = varsayılan).
ut-global-mining-radius=Maden sondajlarının kaynak arama alanına ilave karo yarıçapı ekler (0 = varsayılan).
ut-global-lab-speed=Tüm bilim laboratuvarlarının araştırma hızını çarpar (1.0 = varsayılan).
ut-global-energy-multiplier=Binaların elektrik tüketimini ve pasif çekimini çarpar. Bedava enerji için 0 yapın (0.001W).
ut-global-pollution-multiplier=Tüm enerji kaynaklarının yaydığı kirliliği çarpar. Kirliliği kapatmak için 0 yapın.
ut-global-extra-module-slots=Montaj makinelerine, fırınlara, sondajlara, laboratuvarlara ve fenerlere ilave modül yuvası ekler.
ut-global-base-productivity=Modül gerekmeksizin binalara dahili temel verimlilik bonusu ekler (ör. 0.2 = +%20).
ut-global-building-health=Tüm binaların, yapıların ve duvarların azami canını çarpar.

ut-global-gun-damage=Tüm el silahlarının hasarını çarpar.
ut-global-gun-range=Tüm el silahlarının menzilini çarpar.
ut-global-gun-firerate=Tüm el silahlarının atış hızını çarpar (saldırı bekleme süresini düşürür).
ut-global-turret-damage=Tüm taret türlerinin (makineli, lazer, alev, topçu) hasarını çarpar.
ut-global-turret-range=Tüm taret türlerinin saldırı menzilini çarpar.
ut-global-turret-firerate=Tüm taret türlerinin atış hızını çarpar.
ut-global-ammo-damage=Tüm mühimmatların (şarjörler, mermiler, roketler) hasarını çarpar.

ut-custom-building-overrides=DSL ile tekil bina ayarları: 'isim: özellik=değer, özellik=değer; isim2: özellik=değer'. Özellikler: speed, energy, pollution, modules, prod, health, radius.
ut-custom-weapon-overrides=DSL ile tekil silah/taret ayarları: 'isim: özellik=değer; ...'. Özellikler: damage, range, firerate, cooldown, health.
ut-override-assembler3-speed=Montaj Makinesi 3 üretim hızı için özel geçersiz kılma. Varsayılan 1.25.
ut-override-assembler3-modules=Montaj Makinesi 3 modül yuva sayısı için özel geçersiz kılma. Varsayılan 4.
ut-override-electric-drill-speed=Elektrikli Maden Sondajı hızı için özel geçersiz kılma. Varsayılan 0.5.
ut-override-laser-turret-range=Lazer Tareti menzili için özel geçersiz kılma. Varsayılan 24.
ut-override-laser-turret-damage=Lazer Tareti hasar çarpanı için özel geçersiz kılma. Varsayılan 1.0.

[command-help]
tweak-inspect=Fare imlecinin altındaki varlığın ayrıntılı istatistiklerini (hız, can, enerji, modüller, savaş) inceler ve gösterir.
tweak-help=Universal Tweaker sözdizimi kılavuzunu, desteklenen anahtarları ve örnek yapılandırmaları gösterir.
tweak-bonus=<kategori> <değer> - Çalışma zamanında anlık kuvvet bonuslarını ayarlar (kategoriler: crafting, mining, lab, turret).
