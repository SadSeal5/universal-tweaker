[mod-name]
universal-tweaker=Universal Entity & Weapon Tweaker

[mod-description]
universal-tweaker=Freely tweak stats and efficiencies of buildings and weapons in Factorio 2.1, both globally and individually.

[mod-setting-name]
ut-global-crafting-speed=Global crafting speed multiplier
ut-global-mining-speed=Global mining speed multiplier
ut-global-mining-radius=Global extra mining radius
ut-global-lab-speed=Global lab research speed multiplier
ut-global-energy-multiplier=Global energy usage multiplier
ut-global-pollution-multiplier=Global pollution multiplier
ut-global-extra-module-slots=Global extra module slots
ut-global-base-productivity=Global base productivity bonus
ut-global-building-health=Global building health multiplier

ut-global-gun-damage=Global gun damage multiplier
ut-global-gun-range=Global gun range multiplier
ut-global-gun-firerate=Global gun firerate multiplier
ut-global-turret-damage=Global turret damage multiplier
ut-global-turret-range=Global turret range multiplier
ut-global-turret-firerate=Global turret firerate multiplier
ut-global-ammo-damage=Global ammo damage multiplier

ut-custom-building-overrides=Custom building overrides
ut-custom-weapon-overrides=Custom weapon & turret overrides
ut-override-assembler3-speed=Assembler 3 speed override
ut-override-assembler3-modules=Assembler 3 module slots override
ut-override-electric-drill-speed=Electric mining drill speed override
ut-override-laser-turret-range=Laser turret range override
ut-override-laser-turret-damage=Laser turret damage multiplier override

[mod-setting-description]
ut-global-crafting-speed=Multiplies the crafting speed of all assembling machines, furnaces, and silos. (1.0 = vanilla)
ut-global-mining-speed=Multiplies the mining speed of all mining drills. (1.0 = vanilla)
ut-global-mining-radius=Adds extra tile reach to the resource search area of mining drills. (0 = vanilla)
ut-global-lab-speed=Multiplies the research speed of all science labs. (1.0 = vanilla)
ut-global-energy-multiplier=Multiplies power consumption and passive drain for buildings. Set to 0 for free energy (0.001W).
ut-global-pollution-multiplier=Multiplies pollution emissions for all energy sources. Set to 0 to disable pollution.
ut-global-extra-module-slots=Adds extra module slots to assemblers, furnaces, mining drills, labs, and beacons.
ut-global-base-productivity=Adds free built-in productivity bonus to crafting machines and drills without requiring modules (e.g. 0.2 = +20%).
ut-global-building-health=Multiplies maximum health for all buildings, structures, and walls.

ut-global-gun-damage=Multiplies damage output of handheld weapons.
ut-global-gun-range=Multiplies maximum range of handheld weapons.
ut-global-gun-firerate=Multiplies firing speed (reduces attack cooldown) of handheld weapons.
ut-global-turret-damage=Multiplies damage output of all turret types (gun, laser, flamethrower, artillery).
ut-global-turret-range=Multiplies maximum attack range of all turret types.
ut-global-turret-firerate=Multiplies firing rate of all turret types.
ut-global-ammo-damage=Multiplies damage of all ammunition types (magazines, shells, rockets).

ut-custom-building-overrides=Individual building stat overrides using DSL: 'name: key=value, key=value; name2: key=value'. Keys: speed, energy, pollution, modules, prod, health, radius.
ut-custom-weapon-overrides=Individual weapon/turret overrides using DSL: 'name: key=value; ...'. Keys: damage, range, firerate, cooldown, health.
ut-override-assembler3-speed=Dedicated override for Assembling Machine 3 crafting speed. Default is 1.25.
ut-override-assembler3-modules=Dedicated override for Assembling Machine 3 module slots count. Default is 4.
ut-override-electric-drill-speed=Dedicated override for Electric Mining Drill speed. Default is 0.5.
ut-override-laser-turret-range=Dedicated override for Laser Turret shooting range. Default is 24.
ut-override-laser-turret-damage=Dedicated override for Laser Turret damage multiplier. Default is 1.0.

[command-help]
tweak-inspect=Inspect detailed stats (speed, health, energy, modules, combat) of the entity currently targeted by the cursor.
tweak-help=Display Universal Tweaker syntax documentation, supported keys, and configuration examples.
tweak-bonus=<category> <value> - Set live force bonuses at runtime (categories: crafting, mining, lab, turret).
